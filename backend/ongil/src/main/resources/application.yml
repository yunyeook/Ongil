spring:
  application:
    name: ongil
  profiles:
    active: ${SPRING_PROFILES_ACTIVE}

  # Environment Variables
  config:
    import: optional:file:.env.${spring.profiles.active}[.properties]

  # PostgreSQL (AWS RDS)
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=${DB_SSL_MODE:require}&reWriteBatchedInserts=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # JPA/Hibernate
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
        show_sql: false
        jdbc:
          time_zone: Asia/Seoul

  # Redis (AWS ElastiCache)
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}

  cache:
    type: redis
    redis:
      time-to-live: 600000 # 10? TTL ??

  # File Upload
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

  # S3 (Spring Cloud AWS)
  cloud:
    aws:
      region:
        static: ${AWS_REGION}
      credentials:
        access-key: ${AWS_ACCESS_KEY}
        secret-key: ${AWS_SECRET_KEY}
      s3:
        bucket: ${S3_BUCKET}

management:
  endpoints:
    web:
      exposure:
        include: health,info,env,configprops  # ← 추가
  endpoint:
    env:
      enabled: true
    configprops:
      enabled: true

# Custom Properties
ongil:
  aws:
    region: ${AWS_REGION}
    s3:
      bucket: ${S3_BUCKET}

# Server Configuration
server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework  # HTTPS/프록시 환경에서 X-Forwarded-* 헤더 신뢰
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:86400000}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:259200000}
  verification: # phone verification token
    expiration: 300000 # 5 minutes

tmap:
  app-key: ${TMAP_APP_KEY}
  api:
    base-url: https://apis.openapi.sk.com

coolsms:
  api:
    key: ${COOLSMS_API_KEY}        # CoolSMS API KEY
    secret: ${COOLSMS_API_SECRET}  # coolSMS API SECRET
  from: ${COOLSMS_FROM_NUMBER}     # Sender Phone Number
  domain: https://api.coolsms.co.kr


springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

# TURN/STUN Server Configuration
turn:
  server:
    host: ${TURN_SERVER_HOST:43.202.55.40}
    port: ${TURN_SERVER_PORT:3478}
  shared-secret: ${TURN_SHARED_SECRET:your-turn-secret-key-here}
  ttl: ${TURN_TTL:3600}  # 1시간

# CORS Configuration
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}  # local/dev: *, prod: 실제 도메인
  allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,PATCH,OPTIONS}
  allowed-headers: ${CORS_ALLOWED_HEADERS:*}
  allow-credentials: ${CORS_ALLOW_CREDENTIALS:true}
  max-age: ${CORS_MAX_AGE:3600}

# Call Configuration
call:
  timeout-seconds: ${CALL_TIMEOUT_SECONDS:60}  # 통화 타임아웃 (초), 기본 60초
